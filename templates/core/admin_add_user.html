
{% block title %}Add New User{% endblock %}

{% block content %}

<style>
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group.full {
    grid-column: span 2;
  }

  .form-group label {
    font-weight: 600;
    margin-bottom: 6px;
  }

  .form-group input {
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
  }

  .submit-btn {
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }

  .alert {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }

  .alert-success {
    background: #ecfdf5;
    color: #065f46;
    border: 1px solid #a7f3d0;
  }

  .alert-error {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }
</style>

<div class="card">

  <h3 style="margin-top:0;color:#111827;">Add New Admin User</h3>

  <!-- ✅ Django Messages -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <div class="form-grid">

      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" value="{{ request.POST.first_name }}" required>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" value="{{ request.POST.last_name }}" required>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ request.POST.username }}" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ request.POST.email }}" required>
      </div>

      <div class="form-group full">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

    </div>

    <button type="submit" class="submit-btn">Create User</button>
  </form>

</div>
{% endblock %}
