{% extends "core/admin1_dashboard.html" %}

{% block content %}

<!-- Member Management -->
<section id="members" class="mt-5">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark mb-0">Member Management</h3>
    <button class="btn btn-primary shadow-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#addMemberModal">
      <i class="bi bi-person-plus"></i> Add New Member
    </button>
  </div>

  <!-- Members Table Card -->
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">  
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light text-secondary fw-semibold small">
            <tr>
              <th class="ps-4">Email</th>
              <th>Mobile</th>
              <th>Organization</th>
              <th>Signature</th>
              <th class="text-end pe-4">Actions</th>
            </tr>
          </thead>
          <tbody class="text-dark">
            <tr>
              <td class="ps-4 fw-medium">
                <div class="d-flex align-items-center gap-3">
                  <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                    <i class="bi bi-person text-primary"></i>
                  </div>
                  member@gov.in
                </div>
              </td>
              <td>9876543210</td>
              <td>Gov Dept</td>
              <td>
                <span class="badge bg-info text-dark px-3 py-2 rounded-pill">Sig-1</span>
              </td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-primary me-2" title="Edit" data-bs-toggle="modal" data-bs-target="#addMemberModal">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            <!-- Add more rows here -->
          </tbody>
        </table>
      </div>

      <!-- Empty State (uncomment when no members) -->
      <!-- 
      <div class="text-center py-5">
        <img src="empty-members.svg" alt="No members" class="mb-3" style="width: 180px; opacity: 0.6;">
        <p class="text-muted">No members added yet. Click "Add New Member" to start.</p>
      </div>
      -->
    </div>
  </div>
</section>

<!-- Add/Edit Member Modal -->
<div class="modal fade" id="addMemberModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0">
        <h4 class="modal-title fw-bold">Add New Member</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-2">
        <form>
          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control form-control-lg rounded-3" placeholder="name@example.gov.in" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Mobile Number <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-lg rounded-3" placeholder="9876543210" maxlength="10" required>
            </div>
            <div class="col-md-7">
              <label class="form-label fw-semibold">Organization / Department</label>
              <input type="text" class="form-control rounded-3" placeholder="e.g., Ministry of Finance">
            </div>
            <div class="col-md-5">
              <label class="form-label fw-semibold">Signature</label>
              <select class="form-select rounded-3">
                <option value="Sig-1">Sig-1</option>
                <option value="Sig-2">Sig-2</option>
                <option value="Sig-3">Sig-3</option>
                <option value="Sig-4">Sig-4</option>
              </select>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 mt-4">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary px-5">Save Member</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
