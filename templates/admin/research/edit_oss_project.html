{% extends "admin/base.html" %}
{% block title %}Edit OSS project{% endblock %}
{% block content %}
<div class="admin-section">
  <h2 class="mb-3">Edit OSS project</h2>
  {% include "admin/research/_messages.html" %}
  <form method="post" class="card card-body">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Project name</label><input class="form-control" name="name" value="{{ project.name }}" required></div>
      <div class="col-md-6"><label class="form-label">Slug</label><input class="form-control" name="slug" value="{{ project.slug }}" required></div>
      <div class="col-md-6"><label class="form-label">Broad topic</label><select class="form-select" name="broad_topic">{% for bt in broad_topics %}<option value="{{ bt.pk }}" {% if bt.pk == project.broad_topic_id %}selected{% endif %}>{{ bt.name }}</option>{% endfor %}</select></div>
      <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option value="pending" {% if project.status == 'pending' %}selected{% endif %}>Pending</option><option value="approved" {% if project.status == 'approved' %}selected{% endif %}>Approved</option><option value="rejected" {% if project.status == 'rejected' %}selected{% endif %}>Rejected</option></select></div>
      <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4">{{ project.description }}</textarea></div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="{% url 'admin_research_broad_topic_submissions' project.broad_topic_id %}">Back</a>
    </div>
  </form>
</div>
{% endblock %}
