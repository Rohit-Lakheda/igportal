{% extends "admin/base.html" %}
{% block title %}Edit paper version{% endblock %}
{% block content %}
<div class="admin-section">
  <h2 class="mb-3">Edit paper version (v{{ paper.version }})</h2>
  {% include "admin/research/_messages.html" %}
  <form method="post" enctype="multipart/form-data" class="card card-body">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-8"><label class="form-label">Title</label><input class="form-control" name="title" value="{{ paper.title }}" required></div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          <option value="pending" {% if paper.status == 'pending' %}selected{% endif %}>Pending</option>
          <option value="approved" {% if paper.status == 'approved' %}selected{% endif %}>Approved</option>
          <option value="rejected" {% if paper.status == 'rejected' %}selected{% endif %}>Rejected</option>
        </select>
      </div>
      <div class="col-12"><label class="form-label">Abstract</label><textarea class="form-control" name="abstract" rows="4">{{ paper.abstract }}</textarea></div>
      <div class="col-md-6"><label class="form-label">Specific topic</label><select class="form-select" name="specific_topic">{% for t in specific_topics %}<option value="{{ t.pk }}" {% if t.pk == paper.specific_topic_id %}selected{% endif %}>{{ t.broad_topic.name }} - {{ t.name }}</option>{% endfor %}</select></div>
      <div class="col-md-3"><label class="form-label">Submitter</label><input class="form-control" name="submitter_display_name" value="{{ paper.submitter_display_name }}"></div>
      <div class="col-md-3"><label class="form-label">Email</label><input class="form-control" name="submitter_email" value="{{ paper.submitter_email }}"></div>
      <div class="col-12">
        <label class="form-label">Replace file (optional)</label>
        <input class="form-control" type="file" name="document">
      </div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="{% url 'admin_research_broad_topic_submissions' paper.specific_topic.broad_topic_id %}">Back</a>
    </div>
  </form>
</div>
{% endblock %}
