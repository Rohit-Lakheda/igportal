{% extends "admin/base.html" %}
{% block title %}Edit specific topic{% endblock %}
{% block content %}
<div class="admin-section">
  <h2 class="mb-3">Edit specific topic</h2>
  {% include "admin/research/_messages.html" %}
  <form method="post" class="card card-body">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Topic name</label><input class="form-control" name="name" value="{{ topic.name }}" required></div>
      <div class="col-md-6"><label class="form-label">Slug</label><input class="form-control" name="slug" value="{{ topic.slug }}" required></div>
      <div class="col-md-6">
        <label class="form-label">Broad topic</label>
        <select class="form-select" name="broad_topic">
          {% for bt in broad_topics %}<option value="{{ bt.pk }}" {% if bt.pk == topic.broad_topic_id %}selected{% endif %}>{{ bt.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          <option value="pending" {% if topic.status == 'pending' %}selected{% endif %}>Pending</option>
          <option value="approved" {% if topic.status == 'approved' %}selected{% endif %}>Approved</option>
          <option value="rejected" {% if topic.status == 'rejected' %}selected{% endif %}>Rejected</option>
        </select>
      </div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="{% url 'admin_research_broad_topic_submissions' topic.broad_topic_id %}">Back</a>
    </div>
  </form>
</div>
{% endblock %}
